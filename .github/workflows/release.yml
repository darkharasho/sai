name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules
        run: npx electron-rebuild
      - name: Run unit tests
        run: npm run test:unit
      - name: Run integration tests
        run: npm run test:integration

  build:
    needs: [test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage
          # Pinned to windows-2022: the windows-latest image migrated to Server
          # 2025, where node-gyp can't locate the Visual Studio C++ toolset and
          # the node-pty native rebuild fails ("Could not find any Visual Studio
          # installation to use"). windows-2022 still ships a detectable VS 2022.
          - os: windows-2022
            platform: win
            args: --win nsis
          - os: macos-latest
            platform: mac
            args: --mac dmg zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild

      - name: Build app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Windows is signed with Azure Artifact Signing (win.azureSignOptions in
      # package.json); electron-builder reads the AZURE_* credentials from the
      # environment. Without them it can't authenticate, so fail before the slow
      # build instead of after it.
      - name: Check the Windows signing secrets are set
        if: matrix.platform == 'win'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set (run ~/.claude/templates/windows-signing/set-azure-signing-secrets.sh sai)."; exit 1; }
          done

      - name: Build and publish Electron distributables
        if: matrix.platform != 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npx electron-builder ${{ matrix.args }} --publish always

      # The release stays a draft if this fails, since publish needs every build.
      - name: Verify the Windows installer is signed
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter *.exe | Where-Object { $_.Name -like '*Setup*.exe' }
          if (-not $files) { Write-Error "No installer found in release/"; exit 1 }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Error "$($f.Name) is not validly signed"; exit 1 }
          }

      # electron-builder's createKeychain() makes a temp keychain with a random
      # password, then calls `security set-key-partition-list -k` with the p12
      # password instead (app-builder-lib macCodeSign.js). macOS ignored the bad
      # -k value until runner image 20260828 (Darwin 25.6) started enforcing it,
      # so every mac build on the new image dies with
      #   security: SecKeychainUnlock: The user name or passphrase you entered
      #   is not correct.
      # Import the cert ourselves and point electron-builder at that keychain.
      # Leaving CSC_LINK unset is the load-bearing part: macPackager then uses
      # CSC_KEYCHAIN and never runs the broken createKeychain() path.
      - name: Import macOS signing certificate
        if: matrix.platform == 'mac'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}
          keychain: signing_temp

      # electron-builder silently ad-hoc signs when it can't see an identity,
      # which only surfaces minutes later as a notarization rejection.
      - name: Verify macOS signing identity is visible
        if: matrix.platform == 'mac'
        run: |
          if ! security find-identity -v -p codesigning signing_temp.keychain | grep -q "Developer ID Application"; then
            echo "::error::No Developer ID Application identity in signing_temp.keychain"
            security find-identity -v signing_temp.keychain
            exit 1
          fi

      - name: Build and publish Electron distributables (macOS)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must keep the .keychain suffix: it goes straight to
          # `security find-identity`, which doesn't resolve a bare name.
          CSC_KEYCHAIN: signing_temp.keychain
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder ${{ matrix.args }} --publish always

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # electron-builder creates the release itself when the /release skill's
          # draft isn't there yet, and that release has an empty body. An empty
          # body makes the in-app What's New modal say "No release notes
          # available", so fall back to GitHub's generated notes before publishing.
          body="$(gh release view "$tag" --json body --jq '.body')"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::warning::Release $tag has no notes; falling back to generated notes."
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$tag" --jq '.body' > generated-notes.md
            gh release edit "$tag" --notes-file generated-notes.md
          fi
          gh release edit "$tag" --draft=false
