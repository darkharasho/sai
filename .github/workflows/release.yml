name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules
        run: npx electron-rebuild
      - name: Run unit tests
        run: npm run test:unit
      - name: Run integration tests
        run: npm run test:integration

  build:
    needs: [test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage
          # Pinned to windows-2022: the windows-latest image migrated to Server
          # 2025, where node-gyp can't locate the Visual Studio C++ toolset and
          # the node-pty native rebuild fails ("Could not find any Visual Studio
          # installation to use"). windows-2022 still ships a detectable VS 2022.
          - os: windows-2022
            platform: win
            args: --win nsis
          - os: macos-latest
            platform: mac
            args: --mac dmg zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild

      - name: Build app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build and publish Electron distributables
        if: matrix.platform != 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish always

      # Signing on macOS intermittently dies while electron-builder imports
      # CSC_LINK into a throwaway keychain:
      #   security: SecKeychainUnlock: The user name or passphrase you entered
      #   is not correct.
      # The same secrets and the same commit succeed on a plain re-run (v1.20.10
      # and v1.20.12 both failed here, then passed untouched), so treat it as a
      # flaky runner rather than a bad CSC_KEY_PASSWORD and retry before failing
      # the release. Only mac retries -- a Linux or Windows failure is real, and
      # re-running it just burns ten minutes.
      - name: Build and publish Electron distributables (macOS, retries signing)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          attempts=3
          for i in $(seq 1 "$attempts"); do
            echo "::group::electron-builder attempt $i of $attempts"
            if npx electron-builder ${{ matrix.args }} --publish always; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning::macOS build attempt $i failed; retrying in 30s"
              sleep 30
            fi
          done
          echo "::error::macOS build failed $attempts times; not a transient keychain error"
          exit 1

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # electron-builder creates the release itself when the /release skill's
          # draft isn't there yet, and that release has an empty body. An empty
          # body makes the in-app What's New modal say "No release notes
          # available", so fall back to GitHub's generated notes before publishing.
          body="$(gh release view "$tag" --json body --jq '.body')"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::warning::Release $tag has no notes; falling back to generated notes."
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$tag" --jq '.body' > generated-notes.md
            gh release edit "$tag" --notes-file generated-notes.md
          fi
          gh release edit "$tag" --draft=false
