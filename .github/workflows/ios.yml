name: iOS

# Builds the iOS app (capacitor.config.ts, project in mobile/ios) on a `v*` tag, the same tag that
# builds the desktop apps (release.yml), and uploads it to App Store Connect, where it shows up in
# TestFlight. The app is archived unsigned, ad-hoc signed with its entitlements, and signed for real
# only at export, with cloud-managed distribution signing. Without the App Store Connect secrets,
# and on pull requests, it only checks that the app and its Notification Service Extension compile,
# for the simulator, unsigned.
#
# Release: push tag v<version> (the /release skill). Desktop and iOS share the version.
# Version (CFBundleShortVersionString): the tag (v1.2.3 -> 1.2.3), else package.json "version".
# Build number (CFBundleVersion): minutes since the Unix epoch, so it only grows whichever run built
# it (App Store Connect refuses a reused one).
#
# Once a build is uploaded, it's tagged native/ios/<VERSION+BUILD> (a native release that
# over-the-air updates may target: ota.yml), and on tag pushes it goes straight to App Store review
# (app-store-review). Desktop-only releases (release.yml desktop_release) make their tag with
# GITHUB_TOKEN, which starts no workflows, so they never build iOS.
#
# Secrets (App Store Connect > Users and Access > Integrations > App Store Connect API, an Admin
# key so Xcode can create the distribution certificate and profile itself):
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY (the .p8 file's
#   text) and APPLE_TEAM_ID.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'mobile/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/types.ts'
      - 'src/hooks/**'
      - 'src/components/Chat/**'
      - 'src/lib/chat/**'
      - 'src/lib/clientId.ts'
      - 'src/styles/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUNDLE_ID: com.project96.sai

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      # VERSION+BUILD once App Store Connect has the upload, else empty.
      shipped: ${{ steps.shipped.outputs.version }}
    env:
      PROJECT: mobile/ios/App/App.xcodeproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The iOS build needs no Electron or native Node modules, which postinstall rebuilds.
      - run: npm ci --ignore-scripts

      - name: Build the web files and copy them into the Xcode project
        run: npm run build:ios

      - name: Version
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            [ "$name" = "$pkg" ] || echo "::warning::Tag $GITHUB_REF_NAME doesn't match package.json version ($pkg); using the tag."
          else
            name="$pkg"
          fi
          [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version '$name' isn't x.y.z"; exit 1; }
          number=$(( $(date +%s) / 60 ))
          echo "VERSION=$name" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"
          echo "SAI iOS $name ($number)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for signing secrets
        id: secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPLOAD: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY" ] && [ -n "$TEAM_ID" ] \
            && [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$UPLOAD" = "true" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$UPLOAD" = "true" ]; then
              echo "::warning::App Store Connect secrets aren't set: building for the simulator only, nothing is uploaded."
            fi
          fi

      - name: Compile for the simulator (unsigned)
        if: steps.secrets.outputs.sign == 'false'
        run: |
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive, sign and upload to App Store Connect
        if: steps.secrets.outputs.sign == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          # Removed however the step ends (a failed archive or export included).
          trap 'rm -f "$KEY_PATH"' EXIT
          (umask 077; printf '%s' "$KEY" > "$KEY_PATH")
          AUTH=(-allowProvisioningUpdates
            -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$KEY_ID"
            -authenticationKeyIssuerID "$ISSUER_ID")
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"

          # Archive unsigned and sign only at export (distribution, cloud-managed): signing the
          # archive made a new Apple Development certificate on every fresh runner until the
          # account hit Apple's certificate limit (duel-binder).
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

          # An unsigned archive carries no entitlements, and export signs with the entitlements it
          # finds in the archived binaries, so push (aps-environment) and the Keychain group shared
          # with the extension (keychain-access-groups) would be missing from the uploaded app.
          # Ad-hoc sign the archived bundles ("-": no certificate, nothing created on the account)
          # with the project's entitlements, $(AppIdentifierPrefix) expanded to the team. Export then
          # re-signs them for distribution and sets aps-environment to production.
          APP="$ARCHIVE/Products/Applications/App.app"
          NSE="$APP/PlugIns/NotificationService.appex"
          # Info.plist's AppIdentifierPrefix ($(AppIdentifierPrefix)) is only expanded by a signing
          # build, so the unsigned archive has it empty. The app and extension name the shared
          # Keychain group with it: write the team in now, before signing seals Info.plist. (They
          # also fall back to a Keychain probe at runtime.)
          for plist in "$APP/Info.plist" "$NSE/Info.plist"; do
            /usr/libexec/PlistBuddy -c "Set :AppIdentifierPrefix $TEAM_ID." "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :AppIdentifierPrefix string $TEAM_ID." "$plist"
          done
          ENT_DIR="$RUNNER_TEMP/entitlements"
          mkdir -p "$ENT_DIR"
          for f in App/App.entitlements NotificationService/NotificationService.entitlements; do
            sed "s/\$(AppIdentifierPrefix)/$TEAM_ID./g" "mobile/ios/App/$f" > "$ENT_DIR/$(basename "$f")"
          done
          adhoc() { codesign --force --sign - --timestamp=none --generate-entitlement-der "$@"; }
          shopt -s nullglob
          for fw in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib \
                    "$APP"/PlugIns/*.appex/Frameworks/*.framework; do
            adhoc "$fw"
          done
          adhoc --entitlements "$ENT_DIR/NotificationService.entitlements" "$NSE"
          adhoc --entitlements "$ENT_DIR/App.entitlements" "$APP"
          for b in "$APP" "$NSE"; do
            ents=$(codesign -d --entitlements - --xml "$b" 2>/dev/null)
            grep -q "$TEAM_ID.com.project96.sai.shared" <<<"$ents" \
              || { echo "::error::$b has no shared keychain-access-groups entitlement"; exit 1; }
            prefix=$(/usr/libexec/PlistBuddy -c "Print :AppIdentifierPrefix" "$b/Info.plist" 2>/dev/null || true)
            [ "$prefix" = "$TEAM_ID." ] \
              || { echo "::error::$b/Info.plist AppIdentifierPrefix is '$prefix', not '$TEAM_ID.'"; exit 1; }
          done
          grep -q aps-environment <<<"$(codesign -d --entitlements - --xml "$APP" 2>/dev/null)" \
            || { echo "::error::App.app has no aps-environment entitlement"; exit 1; }

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          # What export actually signed with (when Xcode leaves a summary for an upload).
          if [ -f "$RUNNER_TEMP/export/DistributionSummary.plist" ]; then
            plutil -p "$RUNNER_TEMP/export/DistributionSummary.plist" | grep -E 'aps-environment|keychain-access-groups|com.project96' || true
          fi
          echo "Uploaded $VERSION ($BUILD_NUMBER) to App Store Connect; it reaches TestFlight once processed." >> "$GITHUB_STEP_SUMMARY"

      # Only reached when the export above (destination upload) succeeded.
      - name: Shipped
        id: shipped
        if: steps.secrets.outputs.sign == 'true'
        run: echo "version=$VERSION+$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  # Tags each build that reached App Store Connect as native/ios/<VERSION+BUILD>: the native releases
  # over-the-air updates target (ota.yml, scripts/native-release-targets.sh). BUILD is the
  # CFBundleVersion the installed app reports (App.getInfo().build). Simulator builds and failed
  # uploads get no tag. Tags pushed with GITHUB_TOKEN start no workflows.
  native-shipped:
    needs: ios
    if: needs.ios.outputs.shipped != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the native release
        env:
          GH_TOKEN: ${{ github.token }}
          SHIPPED: ${{ needs.ios.outputs.shipped }}
        run: |
          ref="refs/tags/native/ios/$SHIPPED"
          if gh api "repos/$GITHUB_REPOSITORY/git/$ref" --silent 2>/dev/null; then
            echo "$ref already exists"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA" --silent
            echo "Tagged $ref" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # Tag releases go straight to App Store review once TestFlight has processed the build, pulling an
  # older version that's waiting for review or in review: the newest build is the one worth
  # reviewing, and over-the-air updates (ota.yml also targets the App Store's live version) carry
  # web changes meanwhile. A failed submission is a warning; submit.yml can submit the build later.
  app-store-review:
    needs: ios
    if: startsWith(github.ref, 'refs/tags/v') && needs.ios.outputs.shipped != ''
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Submit for App Store review
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          RELEASE: ${{ needs.ios.outputs.shipped }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          (umask 077; printf '%s' "$ASC_KEY" > "$ASC_KEY_PATH")
          if python3 scripts/asc-submit.py submit "$BUNDLE_ID" "$RELEASE" --wait 90 --replace-waiting \
              --whats-new "Bug fixes and improvements." | tee -a "$GITHUB_STEP_SUMMARY"; [ "${PIPESTATUS[0]}" = 0 ]; then
            echo "Submitted $RELEASE for App Store review" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$RELEASE wasn't submitted for App Store review (see the log). Submit it later with submit.yml."
          fi
